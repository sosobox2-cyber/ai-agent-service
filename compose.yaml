services:
  ai-agent-service:
    build: .
    image: ai-agent-service:local
    ports:
      - "${HOST_ADDRESS:-127.0.0.1}:${HOST_PORT:-8081}:8081"
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      PORT: "8081"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini}"
      AI_AGENT_SECURITY_ENABLED: "${AI_AGENT_SECURITY_ENABLED:-true}"
      AI_AGENT_API_KEY: "${AI_AGENT_API_KEY:-}"
      AI_AGENT_API_KEY_ID: "${AI_AGENT_API_KEY_ID:-internal-test}"
      AI_AGENT_RATE_LIMIT_ENABLED: "${AI_AGENT_RATE_LIMIT_ENABLED:-true}"
      AI_AGENT_RATE_LIMIT_PER_MINUTE: "${AI_AGENT_RATE_LIMIT_PER_MINUTE:-30}"
    restart: unless-stopped
