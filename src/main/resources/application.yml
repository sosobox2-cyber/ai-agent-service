# 서버 주소·포트는 환경 변수로 재정의하며 기본값은 로컬 접속만 허용한다.
server:
  port: ${PORT:8081}
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 33MB
  application:
    name: ai-agent-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  ai:
    # 실제 AI 호출의 키·모델과 응답 생성 옵션을 설정한다.
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4.1-mini}
          temperature: 0
          max-tokens: 4096
# 서비스 API 인증·호출 제한은 OpenAI 키와 별개의 설정이다.
app:
  evaluation:
    enabled: ${EVALUATION_ENABLED:false}
    storage: ${EVALUATION_STORAGE:file}
    blob-store-id: ${BLOB_STORE_ID:}
    data-directory: ${EVALUATION_DATA_DIRECTORY:data/evaluation}
    sample-file: ${EVALUATION_SAMPLE_FILE:}
    sample-name: ${EVALUATION_SAMPLE_NAME:}
    local-ui-enabled: ${EVALUATION_LOCAL_UI_ENABLED:false}
    local-bind-address: ${EVALUATION_LOCAL_BIND_ADDRESS:${server.address:127.0.0.1}}
  security:
    enabled: ${AI_AGENT_SECURITY_ENABLED:true}
    api-key: ${AI_AGENT_API_KEY:}
    api-key-id: ${AI_AGENT_API_KEY_ID:internal-test}
    rate-limit:
      enabled: ${AI_AGENT_RATE_LIMIT_ENABLED:true}
      per-minute: ${AI_AGENT_RATE_LIMIT_PER_MINUTE:30}
  # 최종 자동 적용 기준과 공급자 HTTP 연결·읽기 제한 시간을 설정한다.
  inference:
    confidence-threshold: 0.80
    prompt-version: coupang-option-v30
    connect-timeout: 5s
    read-timeout: 30s
  ai:
    # AUTO는 요청별 LIGHT/FULL 선택, FULL은 전체 프롬프트 강제 사용이다.
    prompt-mode: ${AI_PROMPT_MODE:AUTO}
    usage-log-enabled: ${AI_USAGE_LOG_ENABLED:true}
    usage-jsonl-enabled: ${AI_USAGE_JSONL_ENABLED:true}
    # 호출 이력을 일별 회전 파일로 기록하며 보관 기간·총용량을 제한한다.
    usage-jsonl-path: ${AI_USAGE_JSONL_PATH:logs/ai-usage.jsonl}
    usage-jsonl-max-history: ${AI_USAGE_JSONL_MAX_HISTORY:30}
    usage-jsonl-total-size-cap: ${AI_USAGE_JSONL_TOTAL_SIZE_CAP:1GB}
    # 기존 추정 단가를 코드에서 외부 설정으로 이동. 운영 단가는 관리자가 갱신한다.
    usage-pricing:
      models:
        "[gpt-4.1-mini]":
          input-per-million: ${AI_PRICE_INPUT_PER_MILLION:0.40}
          cached-per-million: ${AI_PRICE_CACHED_PER_MILLION:0.10}
          output-per-million: ${AI_PRICE_OUTPUT_PER_MILLION:1.60}
        "[gpt-4.1-mini-2025-04-14]":
          input-per-million: ${AI_PRICE_INPUT_PER_MILLION:0.40}
          cached-per-million: ${AI_PRICE_CACHED_PER_MILLION:0.10}
          output-per-million: ${AI_PRICE_OUTPUT_PER_MILLION:1.60}
# LIGHT 검증 실패만 FULL로 한 번 재시도하며 신뢰도에 의한 재시도 기준은 기본 비활성이다.
purchase-option:
  ai:
    retry:
      enabled: true
      max-retries: 1
      confidence-threshold-enabled: false
      confidence-threshold: 0.7
# 공급자·HTTP 라이브러리의 상세 로그를 줄이고 사용량은 전용 로거에서 기록한다.
logging:
  level:
    org.springframework.ai: ERROR
    org.springframework.web.client: ERROR
