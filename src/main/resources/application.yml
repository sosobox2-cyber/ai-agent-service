server:
  port: ${PORT:8081}
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: ai-agent-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4.1-mini}
          temperature: 0
          max-tokens: 4096
app:
  inference:
    confidence-threshold: 0.80
    prompt-version: coupang-option-v26
    connect-timeout: 5s
    read-timeout: 30s
  ai:
    prompt-mode: ${AI_PROMPT_MODE:AUTO}
    usage-log-enabled: ${AI_USAGE_LOG_ENABLED:false}
    usage-jsonl-enabled: ${AI_USAGE_JSONL_ENABLED:true}
    usage-jsonl-path: ${AI_USAGE_JSONL_PATH:logs/ai-usage.jsonl}
    usage-jsonl-max-history: ${AI_USAGE_JSONL_MAX_HISTORY:30}
    usage-jsonl-total-size-cap: ${AI_USAGE_JSONL_TOTAL_SIZE_CAP:1GB}
    # 기존 추정 단가를 코드에서 외부 설정으로 이동. 운영 단가는 관리자가 갱신한다.
    usage-pricing:
      models:
        "[gpt-4.1-mini]":
          input-per-million: ${AI_PRICE_INPUT_PER_MILLION:0.40}
          cached-per-million: ${AI_PRICE_CACHED_PER_MILLION:0.10}
          output-per-million: ${AI_PRICE_OUTPUT_PER_MILLION:1.60}
        "[gpt-4.1-mini-2025-04-14]":
          input-per-million: ${AI_PRICE_INPUT_PER_MILLION:0.40}
          cached-per-million: ${AI_PRICE_CACHED_PER_MILLION:0.10}
          output-per-million: ${AI_PRICE_OUTPUT_PER_MILLION:1.60}
purchase-option:
  ai:
    retry:
      enabled: true
      max-retries: 1
      confidence-threshold-enabled: false
      confidence-threshold: 0.7
logging:
  level:
    org.springframework.ai: ERROR
    org.springframework.web.client: ERROR
