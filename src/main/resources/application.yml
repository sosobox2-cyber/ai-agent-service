server:
  port: ${PORT:8081}
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: ai-agent-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4.1-mini}
          temperature: 0
          max-tokens: 4096
app:
  inference:
    confidence-threshold: 0.80
    prompt-version: coupang-option-v15
    connect-timeout: 5s
    read-timeout: 30s
logging:
  level:
    org.springframework.ai: ERROR
    org.springframework.web.client: ERROR
